<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>B1 Anonymous Review</title>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <header class="topbar">
      <div>
        <h1>B1 Anonymous Review</h1>
        <p id="task-meta">Loading manifest...</p>
      </div>
      <div class="reviewer-field">
        <label for="reviewer-id">Reviewer ID</label>
        <input id="reviewer-id" autocomplete="off" placeholder="required">
      </div>
      <div class="progress-wrap" aria-label="Review progress">
        <span id="progress-text">0 / 0</span>
        <progress id="progress" value="0" max="1"></progress>
      </div>
    </header>

    <main>
      <nav class="toolbar" aria-label="Task navigation">
        <button id="prev" type="button">Previous</button>
        <button id="next-incomplete" type="button">Next incomplete</button>
        <select id="task-filter" aria-label="Filter tasks">
          <option value="all">All tasks</option>
          <option value="incomplete">Incomplete only</option>
          <option value="catastrophe">Catastrophe review</option>
          <option value="action">Action review</option>
        </select>
        <button id="export" type="button">Export JSON</button>
        <label class="import-label">Import JSON<input id="import" type="file" accept="application/json"></label>
      </nav>

      <section class="task-header">
        <div>
          <span id="kind-badge" class="badge"></span>
          <strong id="baseline"></strong>
        </div>
        <p id="prompt"></p>
        <p id="conditioning-note" class="notice" hidden></p>
      </section>

      <section id="review-root" aria-live="polite"></section>
      <p id="validation" class="validation" role="status"></p>
    </main>

    <footer>
      <button id="previous-bottom" type="button">Previous</button>
      <button id="complete-next" class="primary" type="button">Mark complete and next</button>
    </footer>
    <script src="app.js"></script>
  </body>
</html>
